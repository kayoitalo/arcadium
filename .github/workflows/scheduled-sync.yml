name: Scheduled History Sync

on:
  schedule:
    # Toda hora, no minuto 0
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Execute Hourly Listening Sync
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Sync API Endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
        run: |
          set -euo pipefail

          # Sem palpite de domínio. Um fallback chumbado faz o job rodar de
          # hora em hora contra uma URL morta e o erro parece ser do app,
          # quando na verdade falta configuração.
          missing=""
          [ -n "${APP_URL:-}" ] || missing="${missing} APP_URL"
          [ -n "${CRON_SECRET:-}" ] || missing="${missing} CRON_SECRET"
          [ -n "${LASTFM_USERNAME:-}" ] || missing="${missing} LASTFM_USERNAME"

          if [ -n "${missing}" ]; then
            echo "Secrets ausentes:${missing}"
            echo "Cadastre em Settings > Secrets and variables > Actions."
            echo "APP_URL deve ser a origem da aplicação, ex.: https://seu-app.vercel.app"
            exit 1
          fi

          TARGET_URL="${APP_URL%/}/api/sync"
          echo "Disparando sincronização em ${TARGET_URL}"

          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            --max-time 120 \
            -X POST "${TARGET_URL}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -d "{\"username\": \"${LASTFM_USERNAME}\"}")

          echo "HTTP ${HTTP_STATUS}"
          cat response.json || true

          if [ "${HTTP_STATUS}" -ge 400 ]; then
            echo "A sincronização falhou com status ${HTTP_STATUS}"
            exit 1
          fi

      - name: Renovar os textos da IA
        # Depois do sync, e só se ele passou: a renovação decide pela escuta
        # nova. A rota gera no máximo um pacote por execução e pula sozinha
        # o que ainda está fresco, então rodar de hora em hora não gasta cota.
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          TARGET_URL="${APP_URL%/}/api/ai/refresh"
          echo "Renovando os textos em ${TARGET_URL}"

          # a resposta do modelo é longa: a rota trabalha até 180s
          HTTP_STATUS=$(curl -s -o refresh.json -w "%{http_code}" \
            --max-time 200 \
            -X POST "${TARGET_URL}" \
            -H "Authorization: Bearer ${CRON_SECRET}")

          echo "HTTP ${HTTP_STATUS}"
          cat refresh.json || true

          if [ "${HTTP_STATUS}" -ge 400 ]; then
            echo "A renovação dos textos falhou com status ${HTTP_STATUS}"
            echo "O histórico já foi sincronizado: isto aqui é só a IA."
            exit 1
          fi
